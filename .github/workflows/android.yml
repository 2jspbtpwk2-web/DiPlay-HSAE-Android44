name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect actual source tree
        run: python3 scripts/check_public_tree.py --tree
      - name: Inspect tracked/index source
        run: python3 scripts/check_public_tree.py --tracked
# This workflow does not build, authenticate, install or publish an APK.
